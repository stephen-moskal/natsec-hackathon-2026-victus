[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victus-edge"
version = "0.1.0"
description = "VICTUS edge node — on-drone reasoning and Foundry interface"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.9",
    "ultralytics>=8.1",
]
llm = [
    "llama-cpp-python>=0.2.70",
]
autonomy = [
    "pymavlink>=2.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
victus-edge = "victus_edge.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
