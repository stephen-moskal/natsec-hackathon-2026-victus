# docker compose for victus_edge LLM containers on Jetson Orin Nano Super.
#
# Both services run llama-server in the background + the victus_edge Python
# harness in the foreground. Profiles select which model is loaded.
#
# Usage (run from project root):
#   docker compose -f edge/src/victus_edge/llm/model_containers/compose.yaml --profile qwen3vl build
#   docker compose -f edge/src/victus_edge/llm/model_containers/compose.yaml --profile qwen3vl up
#   docker compose -f edge/src/victus_edge/llm/model_containers/compose.yaml --profile gemma4 up
#
# Only one model can run at a time on the 8 GB Jetson; profile selection
# enforces that.
#
# Models are NOT baked into the image; they are bind-mounted from the host
# (default ~/models). Override with VICTUS_MODELS_DIR.

services:

  victus-qwen3vl:
    profiles: ["qwen3vl"]
    image: victus_edge/qwen3vl:latest
    build:
      context: ../../../../..
      dockerfile: edge/src/victus_edge/llm/model_containers/qwen3vl.Dockerfile
      args:
        L4T_TAG: r36.4.0
    runtime: nvidia
    network_mode: host
    volumes:
      - ${VICTUS_MODELS_DIR:-${HOME}/models}:/opt/models:ro
      - ${VICTUS_TEST_FOOTAGE_DIR:-../../../../test_footage}:/data/test_footage:ro
      - ${VICTUS_OUTPUT_DIR:-../../../../output}:/data/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - VICTUS_LLM_MODEL_PATH=/opt/models/qwen3vl/Qwen3VL-2B-Instruct-Q4_K_M.gguf
      - VICTUS_LLM_MMPROJ_PATH=/opt/models/qwen3vl/mmproj-Qwen3VL-2B-Instruct-F16.gguf
    # Args here are forwarded to `python3 -m victus_edge.main` by entrypoint.sh.
    # victus_edge.main is currently config-driven (no CLI args), so this is empty.
    # Add CLI flags here once the harness supports them.
    command: []

  victus-gemma4:
    profiles: ["gemma4"]
    image: victus_edge/gemma4:latest
    build:
      context: ../../../../..
      dockerfile: edge/src/victus_edge/llm/model_containers/gemma4.Dockerfile
      args:
        L4T_TAG: r36.4.0
    runtime: nvidia
    network_mode: host
    volumes:
      - ${VICTUS_MODELS_DIR:-${HOME}/models}:/opt/models:ro
      - ${VICTUS_TEST_FOOTAGE_DIR:-../../../../test_footage}:/data/test_footage:ro
      - ${VICTUS_OUTPUT_DIR:-../../../../output}:/data/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - VICTUS_LLM_MODEL_PATH=/opt/models/gemma4/gemma-4-E4B-it-Q4_K_M.gguf
      - VICTUS_LLM_MMPROJ_PATH=/opt/models/gemma4/mmproj-gemma-4-E4B-it-BF16.gguf
    command: []
